[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "aioaws/version.py"

[project]
name = "aioaws"
description = "Asyncio SDK for some AWS services."
authors = [{name = "Samuel Colvin", email = "s@muelcolvin.com"}]
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Intended Audience :: System Administrators",
    "Operating System :: Unix",
    "Operating System :: POSIX :: Linux",
    "Environment :: Console",
    "Environment :: MacOS X",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Internet",
    "Typing :: Typed",
]
requires-python = ">=3.11"
dependencies = [
    "aiofiles>=24",
    "cryptography>=43",
    "httpx2>=2.16",
    "pydantic>=2.8",
    "pydantic-settings>=2.4.0"
]
dynamic = ["version"]

[project.urls]
Homepage = "https://github.com/samuelcolvin/aioaws"
Funding = "https://github.com/sponsors/samuelcolvin"
Source = "https://github.com/samuelcolvin/aioaws"
Changelog = "https://github.com/samuelcolvin/aioaws/releases"

[dependency-groups]
dev = [
    "coverage[toml]",
    "basedpyright",
    "ruff",
    "types-aiofiles",
    "pytest>=8",
    "pytest-asyncio",
    "pytest-mock",
    "pytest-pretty",
    "aiohttp",
    "async-timeout",  # required by foxglove-web
    "devtools",
    "dirty-equals",
    "foxglove-web",
    "pillow",
    "pygments",
    "requests",
]

[tool.ruff]
line-length = 120
target-version = "py311"
include = ["aioaws/**/*.py", "tests/**/*.py"]

[tool.ruff.lint]
extend-select = ["Q", "RUF100", "C90", "UP", "I"]
ignore = [
    "E721",
    "C408",   # `dict(...)` calls are used deliberately
    "BLE001", # pretty-printing helpers fall back on any error
]
flake8-quotes = { inline-quotes = "single", multiline-quotes = "double" }
mccabe = { max-complexity = 14 }
pydocstyle = { convention = "google" }

[tool.ruff.format]
quote-style = "single"

[tool.pytest.ini_options]
testpaths = "tests"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = [
    "error",
    "ignore:.*web.AppKey.*",
]

[tool.coverage.run]
source = ["aioaws"]
branch = true
relative_files = true

[tool.coverage.report]
precision = 2
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "raise NotImplemented",
    "if TYPE_CHECKING:",
    "@overload",
]

[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "strict"
reportUnnecessaryTypeIgnoreComment = true
venv = ".venv"
include = ["aioaws"]
